name: TeamSync CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-quality:
    name: Frontend Quality & Design Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Anti-Slop Design System Linter
        run: |
          node .agents/skills/design-taste-frontend/scripts/lint.mjs frontend/src

      - name: Compile TypeScript & Build Frontend Bundle
        run: |
          cd frontend
          npm run build

  backend-quality:
    name: Backend Typecheck & Prisma Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ts-backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd ts-backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd ts-backend
          npx prisma generate

      - name: TypeScript Typecheck
        run: |
          cd ts-backend
          npm run typecheck

  docker-verification:
    name: Docker Compose Syntax & Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
